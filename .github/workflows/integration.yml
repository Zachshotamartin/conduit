name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance-node:
    name: conformance-node
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current conformance harness packages
        run: go test -mod=vendor -race ./test/conformance/... ./internal/protocol/...
  integration-nats:
    name: integration-nats
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current NATS adapter and fault-fixture packages
        run: go test -mod=vendor -race ./internal/bus/nats/... ./test/fault/...
  integration-postgres:
    name: integration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current PostgreSQL adapter packages
        run: go test -mod=vendor -race ./internal/datasource/postgres/...
  socket-hostile:
    name: socket-hostile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current hostile-client and transport packages
        run: go test -mod=vendor -race ./test/hostile/... ./internal/transport/...
      - name: Retain integration failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
