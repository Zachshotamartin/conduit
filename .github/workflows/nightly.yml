name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current parser and token-owning package tests
        run: go test -mod=vendor -race ./internal/protocol/... ./internal/graphql/... ./internal/resume/...
      - name: Install pinned vulnerability scanner
        run: "go install golang.org/x/vuln/cmd/govulncheck@v1.1.4"
      - name: Run pinned vulnerability scanner
        env:
          GOFLAGS: -mod=vendor
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'
      - name: Retain fuzz-family evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-fuzz-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
  soak-accelerated:
    name: soak-accelerated
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current queue and fanout package tests
        run: go test -mod=vendor -race ./internal/queue/... ./internal/fanout/...
      - name: Retain soak-family evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-soak-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
  chaos-full:
    name: chaos-full
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current memory-bus and fault-fixture package tests
        run: go test -mod=vendor -race ./internal/bus/memory/... ./test/fault/...
      - name: Retain chaos-family evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-chaos-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
  nats-matrix:
    name: nats-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current NATS adapter package tests
        run: go test -mod=vendor -race ./internal/bus/nats/...
  bench-regression:
    name: bench-regression
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run all currently registered benchmarks
        run: go test -mod=vendor -bench=. ./...
  index-property-extended:
    name: index-property-extended
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current filter package tests with the race detector
        run: go test -mod=vendor -race ./internal/filter/...
