name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Check formatting
        run: GO=go ./scripts/check-format.sh
      - name: Check deterministic test sources
        run: ./scripts/check-determinism.sh
      - name: Install pinned staticcheck
        run: "go install honnef.co/go/tools/cmd/staticcheck@v0.5.1"
      - name: Run pinned staticcheck
        env:
          GOFLAGS: -mod=vendor
        run: '"$(go env GOPATH)/bin/staticcheck" ./...'
      - name: Install pinned golangci-lint
        run: "go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2"
      - name: Run pinned golangci-lint
        env:
          GOFLAGS: -mod=vendor
        run: '"$(go env GOPATH)/bin/golangci-lint" run'
      - name: Check claims status
        run: go run -mod=vendor ./tools/claimslint .
  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Vet all packages
        run: go vet -mod=vendor ./...
  arch-check:
    name: arch-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Enforce package boundaries
        run: go run -mod=vendor ./tools/archcheck
  unit-race:
    name: unit-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run all tests with the race detector
        run: go test -mod=vendor -race -shuffle=on ./...
      - name: Retain PR failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-failure-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  proto-race:
    name: proto-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current protocol package tests with the race detector
        run: go test -mod=vendor -race -shuffle=on ./internal/protocol/...
  authz-race:
    name: authz-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current authorization package tests with the race detector
        run: go test -mod=vendor -race -shuffle=on ./internal/auth/...
  index-race:
    name: index-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current index package tests with the race detector
        run: go test -mod=vendor -race -shuffle=on ./internal/filter/index/...
  docs-status-lint:
    name: docs-status-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Enforce documentation status vocabulary
        run: go run -mod=vendor ./tools/docsstatus ./docs
      - name: Enforce claims status
        run: go run -mod=vendor ./tools/claimslint .
  metrics-contract:
    name: metrics-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current observability package tests
        run: go test -mod=vendor ./internal/observability/...
  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Test dependency policy
        run: go test -mod=vendor ./tools/depsaudit
      - name: Enforce dependency policy
        run: go run -mod=vendor ./tools/depsaudit -root .
      - name: Install pinned vulnerability scanner
        run: "go install golang.org/x/vuln/cmd/govulncheck@v1.1.4"
      - name: Run pinned vulnerability scanner
        env:
          GOFLAGS: -mod=vendor
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'
  trace-check:
    name: trace-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current trace-owning package tests
        run: go test -mod=vendor ./tools/tracecheck ./internal/observability/... ./internal/transport/...
      - name: Enforce requirement traceability
        run: go run -mod=vendor ./tools/tracecheck -root .
  macos-correctness:
    name: macos-correctness
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Report runner platform
        run: go env GOOS GOARCH
      - name: Check formatting
        run: GO=go ./scripts/check-format.sh
      - name: Check deterministic test sources
        run: ./scripts/check-determinism.sh
      - name: Vet all packages
        run: go vet -mod=vendor ./...
      - name: Run complete race suite
        run: go test -mod=vendor -race -shuffle=on ./...
      - name: Enforce architecture boundaries
        run: go run -mod=vendor ./tools/archcheck
      - name: Enforce documentation and claims status
        run: go run -mod=vendor ./tools/docsstatus ./docs && go run -mod=vendor ./tools/claimslint .
      - name: Enforce CI contract
        run: go run -mod=vendor ./tools/cicontract -root .
      - name: Enforce dependency and traceability contracts
        run: go run -mod=vendor ./tools/depsaudit -root . && go run -mod=vendor ./tools/tracecheck -root .
