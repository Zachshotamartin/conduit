name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current command package tests
        run: go test -mod=vendor ./cmd/...
      - name: Retain release diagnostics until R10 permanent attachment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current release metadata package tests
        run: go test -mod=vendor ./cmd/... ./internal/observability/...
  cross-version-fixtures:
    name: cross-version-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current compatibility fixture packages
        run: go test -mod=vendor ./test/fixtures/...
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current packaging package tests before R10 image construction
        run: go test -mod=vendor ./cmd/conduit/...
  kind-install:
    name: kind-install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          check-latest: false
          cache: false
      - name: Run current install-facing conformance packages before R10 manifests
        run: go test -mod=vendor ./test/conformance/... ./cmd/conduit/...
