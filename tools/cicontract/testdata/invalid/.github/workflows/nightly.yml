name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz-renamed
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - run: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: short-lived-fuzz-corpus
          path: testdata/fuzz/
          retention-days: 30
