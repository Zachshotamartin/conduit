name: pr

on:
  push:
    branches: [develop]

permissions: write-all

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: staticcheck ./...
      - uses: actions/upload-artifact@v4
        with:
          name: short-lived-pr-evidence
          path: reports/
          retention-days: 7
  unit-race:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: go test ./...
