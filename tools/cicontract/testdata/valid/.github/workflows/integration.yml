name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance-node:
    name: conformance-node
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: go test -mod=vendor -race ./test/conformance/... ./internal/protocol/...
  integration-nats:
    name: integration-nats
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: go test -mod=vendor -race ./internal/bus/nats/... ./test/fault/...
  integration-postgres:
    name: integration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: go test -mod=vendor -race ./internal/datasource/postgres/...
  socket-hostile:
    name: socket-hostile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: go test -mod=vendor -race ./test/hostile/... ./internal/transport/...
      - name: Retain integration failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-failure-evidence
          path: reports/
          retention-days: 30
