name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -race ./internal/protocol/... ./internal/graphql/... ./internal/resume/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: '"$(go env GOPATH)/bin/govulncheck" ./...'
      - name: Retain fuzz corpora
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-corpora
          path: testdata/fuzz/
          retention-days: 90
  soak-accelerated:
    name: soak-accelerated
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -race ./internal/queue/... ./internal/fanout/...
      - name: Retain soak captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soak-captures
          path: reports/soak/
          retention-days: 90
  chaos-full:
    name: chaos-full
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -race ./internal/bus/memory/... ./test/fault/...
      - name: Retain chaos captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chaos-captures
          path: reports/chaos/
          retention-days: 90
  nats-matrix:
    name: nats-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -race ./internal/bus/nats/...
  bench-regression:
    name: bench-regression
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -bench=. ./...
  index-property-extended:
    name: index-property-extended
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor -race ./internal/filter/...
