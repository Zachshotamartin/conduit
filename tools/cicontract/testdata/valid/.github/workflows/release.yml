name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor ./cmd/...
      - name: Retain release diagnostics until permanent attachment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics
          path: reports/release/
          retention-days: 90
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor ./cmd/... ./internal/observability/...
  cross-version-fixtures:
    name: cross-version-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor ./test/fixtures/...
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor ./cmd/conduit/...
  kind-install:
    name: kind-install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"
          check-latest: false
          cache: false
      - run: go test -mod=vendor ./test/conformance/... ./cmd/conduit/...
