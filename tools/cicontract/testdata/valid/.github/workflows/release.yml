name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"
      - name: Retain release diagnostics until permanent attachment
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: reports/release/
          retention-days: 90
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"
  cross-version-fixtures:
    name: cross-version-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"
  kind-install:
    name: kind-install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"
