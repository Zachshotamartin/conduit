name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: go test -mod=vendor ./cmd/...
      - name: Retain release diagnostics until permanent attachment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics
          path: reports/release/
          retention-days: 90
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: go test -mod=vendor ./cmd/...
  cross-version-fixtures:
    name: cross-version-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: go test -mod=vendor ./test/fixtures/...
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: go test -mod=vendor ./cmd/conduit/...
  kind-install:
    name: kind-install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: go test -mod=vendor ./test/conformance/...
